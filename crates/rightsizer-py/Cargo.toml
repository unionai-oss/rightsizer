[package]
name = "rightsizer-py"
description = "PyO3 module rightsizer._core: core + features + estimators + history (object store, sqlite) + engine; no kube-rs, no postgres."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "_core"
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Turned on by maturin when building the wheel; off by default so `cargo test` links.
extension-module = ["pyo3/extension-module"]

[dependencies]
rightsizer-core.workspace = true
rightsizer-engine = { workspace = true, features = ["object-store", "sqlite"] }
serde_json.workspace = true
pyo3.workspace = true
pyo3-async-runtimes.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
