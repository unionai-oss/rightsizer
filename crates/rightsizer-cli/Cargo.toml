[package]
name = "rightsizer-cli"
description = "rsz: the rightsizer CLI, daemon (plugin protocol server) and plugin discovery."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "rsz"
path = "src/main.rs"

[features]
default = ["k8s", "slurm", "postgres"]
k8s = ["dep:rightsizer-k8s", "rightsizer-k8s/webhook", "rightsizer-k8s/cluster"]
slurm = ["dep:rightsizer-slurm"]
postgres = ["rightsizer-engine/postgres"]
s3 = ["rightsizer-engine/s3"]
remote = ["rightsizer-engine/remote"]

[dependencies]
rightsizer-core.workspace = true
rightsizer-engine.workspace = true
rightsizer-history.workspace = true
rightsizer-estimators.workspace = true
rightsizer-plugin.workspace = true
rightsizer-k8s = { workspace = true, optional = true }
rightsizer-slurm = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
serde_norway.workspace = true
anyhow.workspace = true
clap.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "net"] }
tracing.workspace = true
tracing-subscriber.workspace = true
prometheus.workspace = true
which.workspace = true
chrono.workspace = true
ulid.workspace = true
humantime.workspace = true
async-trait.workspace = true

[dev-dependencies]
tempfile.workspace = true
assert_cmd.workspace = true
