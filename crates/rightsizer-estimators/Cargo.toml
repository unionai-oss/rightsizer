[package]
name = "rightsizer-estimators"
description = "Estimator trait and built-in estimators (rules-sized, history-peak, prior, gbt), remote client and chains for rightsizer (SPEC §6)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
# Estimator Protocol v1 client (SPEC §6.3).
remote = ["dep:reqwest", "tokio/rt"]

[dependencies]
rightsizer-core.workspace = true
rightsizer-features.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
async-trait.workspace = true
futures.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
tracing.workspace = true
reqwest = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true
chrono.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net"] }
# In-process mock server for the remote client's tests (dev only: deps-check
# looks at normal and build edges).
axum.workspace = true
