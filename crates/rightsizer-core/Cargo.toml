[package]
name = "rightsizer-core"
description = "Pure, synchronous core of rightsizer: data model, units, grids, normalization, cost model, constraints, decision rule, breaker and policy logic."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
# JSON Schema derivations (used by `cargo xtask schemas`).
schema = ["dep:schemars"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
chrono.workspace = true
ulid.workspace = true
sha2.workspace = true
enumflags2.workspace = true
schemars = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true
criterion.workspace = true

[[bench]]
name = "decide"
harness = false
