[package]
name = "rightsizer-features"
description = "Input metadata readers (bounded range reads), code tokens, context digest and feature buckets for rightsizer (SPEC §9)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
s3 = ["object_store/aws"]
gcs = ["object_store/gcp"]
azure = ["object_store/azure"]
# HTTP(S) inputs and Hugging Face model refs (`hf://`), behind the SSRF guard.
http = ["object_store/http", "dep:reqwest"]

[dependencies]
rightsizer-core.workspace = true
serde_json.workspace = true
thiserror.workspace = true
futures.workspace = true
tokio = { workspace = true, features = ["time", "net", "fs"] }
object_store.workspace = true
bytes.workspace = true
url.workspace = true
parquet = { workspace = true }
sha2.workspace = true
hex.workspace = true
tracing.workspace = true
reqwest = { workspace = true, optional = true }

[dev-dependencies]
async-trait.workspace = true
tempfile.workspace = true
proptest.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
