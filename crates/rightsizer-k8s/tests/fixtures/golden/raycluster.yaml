apiVersion: ray.io/v1
kind: RayCluster
metadata:
  name: batch-infer
  namespace: ml
spec:
  rayVersion: "2.60.0"
  headGroupSpec:
    rayStartParams:
      num-cpus: "0"       # keep tasks off the head
      dashboard-host: "0.0.0.0"
    template:
      spec:
        containers:
          - name: ray-head
            image: rayproject/ray:2.60.0
            resources:
              requests:
                cpu: "2"
                memory: 8Gi
              limits:
                cpu: "2"
                memory: 8Gi
  workerGroupSpecs:
    - groupName: cpu-workers
      replicas: 4
      minReplicas: 1
      maxReplicas: 8
      rayStartParams:
        num-cpus: "6"
        memory: "25769803776"
      template:
        spec:
          containers:
            - name: ray-worker
              image: rayproject/ray:2.60.0
              resources:
                requests:
                  cpu: "6"
                  memory: 24Gi
                limits:
                  cpu: "6"
                  memory: 24Gi
