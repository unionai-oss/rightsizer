apiVersion: batch/v1
kind: Job
metadata:
    name: quick-eval
    namespace: ml
spec:
    template:
        spec:
            restartPolicy: Never
            containers:
                -   name: eval
                    image: ghcr.io/acme/eval:1.4.2
                    command: [python, -m, eval.run]
                    resources:
                        requests:
                            cpu: 1500m
                            memory: 3Gi
                -   name: logs
                    image: fluent/fluent-bit:3.1
                    resources: {requests: {cpu: 100m, memory: 64Mi}}
