apiVersion: kubeflow.org/v1
kind: PyTorchJob
metadata:
  name: resnet-ddp
  namespace: ml
spec:
  runPolicy:
    backoffLimit: 2
  pytorchReplicaSpecs:
    Master:
      replicas: 1
      restartPolicy: OnFailure
      template:
        spec:
          containers:
            - name: pytorch
              image: ghcr.io/acme/resnet:1.0
              command: ["python", "-m", "torch.distributed.run", "train.py"]
              resources:
                requests: {cpu: "8", memory: 32Gi}
                limits: {memory: 48Gi, nvidia.com/gpu: 1}
    Worker:
      replicas: 3
      restartPolicy: OnFailure
      template:
        spec:
          nodeSelector:
            nvidia.com/gpu.product: NVIDIA-A100-SXM4-80GB
          containers:
            - name: pytorch
              image: ghcr.io/acme/resnet:1.0
              resources:
                requests: {cpu: "8", memory: 32Gi}
                limits: {memory: 48Gi, nvidia.com/gpu: 1}
