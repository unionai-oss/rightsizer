apiVersion: batch/v1
kind: CronJob
metadata:
  name: nightly-retrain
  namespace: ml
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: OnFailure
          containers:
          - name: retrain
            image: ghcr.io/acme/retrain:5.1
            resources:
              requests:
                cpu: 8
                memory: 64Gi
              limits:
                memory: 64Gi
