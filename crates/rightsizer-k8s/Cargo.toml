[package]
name = "rightsizer-k8s"
description = "Kubernetes adapter for rightsizer: manifest extract/render/validate (pure); features webhook (axum + rustls) and cluster (kube-rs watcher, restore, Prometheus importer)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["webhook", "cluster"]
webhook = ["dep:axum", "dep:hyper", "dep:hyper-util", "dep:tower", "dep:http", "dep:rustls", "dep:tokio-rustls", "dep:rustls-pemfile", "dep:rcgen", "dep:tokio"]
cluster = ["dep:kube", "dep:k8s-openapi", "dep:tokio", "dep:reqwest"]

[dependencies]
rightsizer-core.workspace = true
rightsizer-plugin.workspace = true
rightsizer-engine.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_norway.workspace = true
thiserror.workspace = true
async-trait.workspace = true
futures.workspace = true
chrono.workspace = true
base64.workspace = true
hmac.workspace = true
sha2.workspace = true
json-patch.workspace = true
tracing.workspace = true
axum = { workspace = true, optional = true }
hyper = { workspace = true, optional = true }
hyper-util = { workspace = true, optional = true }
tower = { workspace = true, optional = true }
http = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
tokio-rustls = { workspace = true, optional = true }
rustls-pemfile = { workspace = true, optional = true }
rcgen = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
kube = { workspace = true, optional = true }
k8s-openapi = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }

[dev-dependencies]
pretty_assertions.workspace = true
insta.workspace = true
