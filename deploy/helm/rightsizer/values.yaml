# rightsizer Helm values (kubernetes.md §0, §3.2, §6, §7).

image:
  repository: ghcr.io/unionai-oss/rsz
  tag: ""            # default: .Chart.AppVersion
  pullPolicy: IfNotPresent

# Tenant prefix: k8s://{cluster}/{namespace}. Must be unique per history store.
cluster: ""

replicas: 2
pdb:
  enabled: true
  minAvailable: 1

# History store (SPEC §8.1). Postgres for the webhook/watcher deployment, or
# an object store URI (s3://bucket/prefix?...). One of:
history:
  postgres:
    url: ""                # postgres://user:pass@host:5432/db  (stored in a Secret)
    existingSecret: ""     # Secret with key `url` instead
  uri: ""                  # any other store URI (s3://…, gs://…, az://…)
  # Extra env for object-store credentials (AWS_*, GOOGLE_*, AZURE_*).
  env: []

webhook:
  port: 8443
  metricsPort: 8080
  # Internal per-request deadline (kubernetes.md §3.2: 1 s < timeoutSeconds 2).
  deadlineMs: 1000
  timeoutSeconds: 2
  # Include TrainJob, RayCluster/RayJob and Volcano Job rules (M3).
  m3Kinds: true
  excludeNamespaces: [kube-system]

# TLS for the webhook. Either cert-manager (Issuer + Certificate, CA
# injected into the MutatingWebhookConfiguration), or a self-signed
# bootstrap generated by Helm at install (kept across upgrades via `lookup`).
tls:
  certManager:
    enabled: false
    # Use an existing issuer instead of the chart's self-signed one.
    issuerRef: {}
    #   name: my-issuer
    #   kind: ClusterIssuer
  selfSigned:
    validityDays: 3650

# HMAC key for the signed rightsizer.io/prior annotation. Generated once if
# empty (kept across upgrades). Rotate with `rsz webhook rotate-key --secret NS/NAME`.
signingKey:
  existingSecret: ""

watcher:
  enabled: true
  prometheusUrl: ""        # cAdvisor peaks when the node agent has none
  scrapeIntervalSeconds: 15

nodeAgent:
  enabled: false
  port: 9102
  intervalMs: 1000
  priorityClassName: ""
  nodeSelector: {}
  tolerations: []
  resources:
    requests: {cpu: 10m, memory: 40Mi}
    limits: {memory: 80Mi}

# Extra rightsizer.toml (merged after the chart's own sections).
config: |
  # [policy]
  # min_history = 3
  # [k8s.inputs.allow]
  # "ml" = ["s3://ml-data/"]

resources:
  requests: {cpu: 100m, memory: 128Mi}
  limits: {memory: 512Mi}

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
priorityClassName: ""

serviceMonitor:
  enabled: false

prometheusRule:
  enabled: false
  labels: {}

grafanaDashboard:
  enabled: false
  labels:
    grafana_dashboard: "1"
