{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "rightsizer.fullname" . }}
  labels: {{- include "rightsizer.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels: {{- include "rightsizer.labels" . | nindent 6 }}
  endpoints:
    - port: metrics
      path: /metrics
{{- end }}
