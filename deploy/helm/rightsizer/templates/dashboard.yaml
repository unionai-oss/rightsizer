{{- if .Values.grafanaDashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rightsizer.fullname" . }}-dashboard
  labels: {{- include "rightsizer.labels" . | nindent 4 }}
    {{- with .Values.grafanaDashboard.labels }}{{ toYaml . | nindent 4 }}{{ end }}
data:
  rightsizer.json: |-
{{ .Files.Get "dashboards/rightsizer.json" | indent 4 }}
{{- end }}
