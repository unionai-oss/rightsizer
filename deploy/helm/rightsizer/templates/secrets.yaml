{{- if not .Values.signingKey.existingSecret }}
{{- $name := include "rightsizer.keySecret" . }}
{{- $old := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "rightsizer.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if and $old $old.data (index $old.data "signing.key") }}
  signing.key: {{ index $old.data "signing.key" }}
  {{- else }}
  signing.key: {{ printf "k1:%s\n" (randAlphaNum 48 | b64enc) | b64enc }}
  {{- end }}
{{- end }}
{{- if and .Values.history.postgres.url (not .Values.history.postgres.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rightsizer.historySecret" . }}
  labels: {{- include "rightsizer.labels" . | nindent 4 }}
type: Opaque
stringData:
  url: {{ .Values.history.postgres.url | quote }}
{{- end }}
