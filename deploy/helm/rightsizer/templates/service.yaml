apiVersion: v1
kind: Service
metadata:
  name: {{ include "rightsizer.serviceName" . }}
  labels: {{- include "rightsizer.labels" . | nindent 4 }}
spec:
  selector: {{- include "rightsizer.selector" . | nindent 4 }}
    app.kubernetes.io/component: webhook
  ports:
    - {name: https, port: 443, targetPort: https}
    - {name: metrics, port: {{ .Values.webhook.metricsPort }}, targetPort: metrics}
