{{- /*
MutatingWebhookConfiguration (kubernetes.md §3.2) and its TLS:
- tls.certManager.enabled: a cert-manager Certificate; cert-manager's CA
  injector fills caBundle (annotation cert-manager.io/inject-ca-from);
- otherwise a self-signed CA + serving cert generated by Helm once and kept
  across upgrades (lookup), with caBundle set here.
*/ -}}
{{- $fullname := include "rightsizer.fullname" . -}}
{{- $svc := include "rightsizer.serviceName" . -}}
{{- $tlsName := include "rightsizer.tlsSecret" . -}}
{{- $caBundle := "" -}}
{{- if not .Values.tls.certManager.enabled }}
{{- $old := lookup "v1" "Secret" .Release.Namespace $tlsName -}}
{{- $crt := "" -}}{{- $key := "" -}}{{- $ca := "" -}}
{{- if and $old $old.data (index $old.data "ca.crt") }}
{{- $crt = index $old.data "tls.crt" -}}{{- $key = index $old.data "tls.key" -}}{{- $ca = index $old.data "ca.crt" -}}
{{- else }}
{{- $dns := list $svc (printf "%s.%s" $svc .Release.Namespace) (printf "%s.%s.svc" $svc .Release.Namespace) (printf "%s.%s.svc.cluster.local" $svc .Release.Namespace) -}}
{{- $caObj := genCA "rightsizer-webhook-ca" (int .Values.tls.selfSigned.validityDays) -}}
{{- $cert := genSignedCert (printf "%s.%s.svc" $svc .Release.Namespace) nil $dns (int .Values.tls.selfSigned.validityDays) $caObj -}}
{{- $crt = $cert.Cert | b64enc -}}{{- $key = $cert.Key | b64enc -}}{{- $ca = $caObj.Cert | b64enc -}}
{{- end }}
{{- $caBundle = $ca }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $tlsName }}
  labels: {{- include "rightsizer.labels" . | nindent 4 }}
type: kubernetes.io/tls
data:
  tls.crt: {{ $crt }}
  tls.key: {{ $key }}
  ca.crt: {{ $ca }}
---
{{ else }}
{{- if not .Values.tls.certManager.issuerRef }}
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ $fullname }}-selfsigned
  labels: {{- include "rightsizer.labels" . | nindent 4 }}
spec:
  selfSigned: {}
---
{{ end }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $fullname }}-webhook
  labels: {{- include "rightsizer.labels" . | nindent 4 }}
spec:
  secretName: {{ $tlsName }}
  dnsNames:
    - {{ $svc }}.{{ .Release.Namespace }}.svc
    - {{ $svc }}.{{ .Release.Namespace }}.svc.cluster.local
  issuerRef:
    {{- if .Values.tls.certManager.issuerRef }}
    {{- toYaml .Values.tls.certManager.issuerRef | nindent 4 }}
    {{- else }}
    name: {{ $fullname }}-selfsigned
    kind: Issuer
    {{- end }}
---
{{ end }}
{{- $hook := dict "fullname" $fullname "svc" $svc "ns" .Release.Namespace "ca" $caBundle "timeout" .Values.webhook.timeoutSeconds -}}
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: {{ $fullname }}
  labels: {{- include "rightsizer.labels" . | nindent 4 }}
  {{- if .Values.tls.certManager.enabled }}
  annotations:
    cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/{{ $fullname }}-webhook
  {{- end }}
webhooks:
  {{- range $name, $path := dict "jobs.rightsizer.io" "/mutate/jobs" "pods.rightsizer.io" "/mutate/pods" }}
  - name: {{ $name }}
    clientConfig:
      service:
        namespace: {{ $hook.ns }}
        name: {{ $hook.svc }}
        port: 443
        path: {{ $path }}
      {{- if $hook.ca }}
      caBundle: {{ $hook.ca }}
      {{- end }}
    rules:
      {{- if eq $name "pods.rightsizer.io" }}
      - {apiGroups: [""], apiVersions: ["*"], operations: [CREATE], resources: [pods], scope: Namespaced}
      {{- else }}
      - {apiGroups: [batch], apiVersions: ["*"], operations: [CREATE], resources: [jobs, cronjobs], scope: Namespaced}
      - {apiGroups: [jobset.x-k8s.io], apiVersions: ["*"], operations: [CREATE], resources: [jobsets], scope: Namespaced}
      - {apiGroups: [kubeflow.org], apiVersions: ["*"], operations: [CREATE], resources: [pytorchjobs], scope: Namespaced}
      {{- if $.Values.webhook.m3Kinds }}
      - {apiGroups: [trainer.kubeflow.org], apiVersions: ["*"], operations: [CREATE], resources: [trainjobs], scope: Namespaced}
      - {apiGroups: [ray.io], apiVersions: ["*"], operations: [CREATE], resources: [rayclusters, rayjobs], scope: Namespaced}
      - {apiGroups: [batch.volcano.sh], apiVersions: ["*"], operations: [CREATE], resources: [jobs], scope: Namespaced}
      {{- end }}
      {{- end }}
    namespaceSelector:
      matchLabels:
        rightsizer.io/enabled: "true"
    objectSelector:
      matchExpressions:
        - {key: rightsizer.io/mode, operator: NotIn, values: ["off"]}
    failurePolicy: Ignore
    matchPolicy: Equivalent
    timeoutSeconds: {{ $hook.timeout }}
    reinvocationPolicy: IfNeeded
    sideEffects: NoneOnDryRun
    admissionReviewVersions: ["v1"]
  {{- end }}
