# rsz-it Slurm cluster. Driven by tests/infra/slurm.sh (project rsz-it-slurm).
name: rsz-it-slurm

x-slurm: &slurm
  image: ${RSZ_IT_SLURM_IMAGE:-rsz-it/slurm:dev}
  init: true
  volumes:
    - ${RSZ_IT_SLURM_EXTRA:?}:/etc/slurm-extra
    - ${RSZ_IT_BIN_DIR:?}:/opt/rsz/bin:ro
    - data:/data
    - logs:/var/log/slurm

services:
  mysql:
    image: ${RSZ_IT_MARIADB_IMAGE:-mariadb:11.8}
    container_name: rsz-it-slurm-mysql
    hostname: mysql
    environment:
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
      MARIADB_DATABASE: slurm_acct_db
      MARIADB_USER: slurm
      MARIADB_PASSWORD: rsz-it-password
    volumes:
      - mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 30

  slurmdbd:
    <<: *slurm
    container_name: rsz-it-slurm-slurmdbd
    hostname: slurmdbd
    command: ["slurmdbd"]
    depends_on:
      mysql: {condition: service_healthy}

  slurmctld:
    <<: *slurm
    container_name: rsz-it-slurm-slurmctld
    hostname: slurmctld
    command: ["slurmctld"]
    working_dir: /data
    depends_on: [slurmdbd]

  c1: &worker
    <<: *slurm
    container_name: rsz-it-slurm-c1
    hostname: c1
    command: ["slurmd"]
    privileged: true
    cgroup: private
    working_dir: /data
    depends_on: [slurmctld]

  c2:
    <<: *worker
    container_name: rsz-it-slurm-c2
    hostname: c2

volumes:
  mysql:
  data:
  logs:
