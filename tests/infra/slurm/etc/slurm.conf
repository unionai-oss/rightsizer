# rsz-it Slurm test cluster. Baked into the image; add overrides in
# tests/infra/.state/slurm-etc-extra/slurm-extra.conf (included below) and run
# `tests/infra/slurm.sh reconfigure`.
ClusterName=rsz-it
SlurmctldHost=slurmctld
SlurmUser=slurm
AuthType=auth/munge
SlurmctldPort=6817
SlurmdPort=6818
StateSaveLocation=/var/lib/slurm
SlurmdSpoolDir=/var/spool/slurm
SlurmctldPidFile=/var/run/slurm/slurmctld.pid
SlurmdPidFile=/var/run/slurm/slurmd.pid
SlurmctldLogFile=/var/log/slurm/slurmctld.log
SlurmdLogFile=/var/log/slurm/slurmd.log
SlurmctldDebug=info
SlurmdDebug=info
ReturnToService=2
SlurmdParameters=config_overrides
MinJobAge=600

# Plugins under test. Scripts live in /etc/slurm-extra (host-mounted) and are
# symlinked into /etc/slurm by the entrypoint.
JobSubmitPlugins=lua
CliFilterPlugins=cli_filter/lua

# cgroup v2 enforcement + accounting.
ProctrackType=proctrack/cgroup
TaskPlugin=task/cgroup,task/affinity
JobAcctGatherType=jobacct_gather/cgroup
JobAcctGatherFrequency=task=5
SelectType=select/cons_tres
SelectTypeParameters=CR_Core_Memory
DefMemPerCPU=256

AccountingStorageType=accounting_storage/slurmdbd
AccountingStorageHost=slurmdbd
AccountingStoreFlags=job_comment,job_script
JobCompType=jobcomp/none

SchedulerType=sched/backfill
InactiveLimit=0
KillWait=5
Waittime=0

NodeName=c[1-2] CPUs=2 RealMemory=2048 State=UNKNOWN
PartitionName=normal Nodes=c[1-2] Default=YES MaxTime=INFINITE State=UP

include /etc/slurm/slurm-extra.conf
