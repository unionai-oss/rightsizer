apiVersion: batch/v1
kind: CronJob
metadata:
  name: nightly
spec:
  schedule: "0 3 * * *"
  suspend: true
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: main
              image: busybox:latest
              command: ["sh", "-c", "sleep 1"]
              resources:
                requests: {cpu: "1", memory: 2Gi}
                limits: {memory: 2Gi}
