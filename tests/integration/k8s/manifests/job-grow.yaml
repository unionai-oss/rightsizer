apiVersion: batch/v1
kind: Job
metadata:
  name: grow
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: main
          image: busybox:latest
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "sleep 1"]
          resources:
            requests: {cpu: 250m, memory: 256Mi}
