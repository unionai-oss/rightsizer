apiVersion: batch/v1
kind: Job
metadata:
  name: ladder
  namespace: rsz-it-lad
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 900
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: main
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent
          command: ["python", "-c", "import time; time.sleep(2); x = b'x' * (400 << 20); time.sleep(3)"]
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {memory: 512Mi}
