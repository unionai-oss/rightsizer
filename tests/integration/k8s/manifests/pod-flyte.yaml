apiVersion: v1
kind: Pod
metadata:
  generateName: wf-t1-
  labels:
    project: flytesnacks
    domain: development
    task-name: wf.t1
spec:
  restartPolicy: Never
  containers:
    - name: main
      image: busybox:latest
      imagePullPolicy: IfNotPresent
      command: ["sh", "-c", "sleep 1"]
      resources:
        requests: {cpu: 250m, memory: 256Mi}
