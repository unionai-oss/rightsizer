apiVersion: batch/v1
kind: Job
metadata:
  name: small
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: main
          image: busybox:latest
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "sleep 2"]
          resources:
            requests: {cpu: 500m, memory: 1Gi}
            limits: {memory: 1Gi}
