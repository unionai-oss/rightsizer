apiVersion: v1
kind: Pod
metadata:
  name: presized
spec:
  restartPolicy: Never
  containers:
    - name: main
      image: busybox:latest
      imagePullPolicy: IfNotPresent
      command: ["sh", "-c", "sleep 1"]
      env:
        - {name: RIGHTSIZER_DECISION, value: "01FLYTESIZED"}
      resources:
        requests: {cpu: 250m, memory: 2Gi}
